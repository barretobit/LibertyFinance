<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liberty Finance</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <div id="page-landing">
    <div class="scanlines"></div>
    <div class="landing-content">
      <div class="landing-badge">LCN-87.3</div>
      <h1 class="landing-title">LIBERTY<br />FINANCE</h1>
      <p class="landing-subtitle">WEALTH MANAGEMENT SYSTEM v1.0</p>
      <div class="landing-status" id="landing-status">SELECT A DATA FILE</div>

      <div id="file-list" class="file-list"></div>
      <div id="file-empty" class="file-empty" style="display: none">NO DATA FILES FOUND</div>

      <div class="file-create">
        <input type="text" id="new-file-name" class="file-input" placeholder="NEW PROFILE NAME" maxlength="40" />
        <button class="btn-enter sm" onclick="createFile()">+ CREATE</button>
      </div>

      <div class="landing-footer">&copy; 2001 LIBERTY CITY NETWORK</div>
    </div>
  </div>

  <script>
    const LAST_FILE_KEY = 'liberty-finance-last-file';
    let selected = localStorage.getItem(LAST_FILE_KEY);

    const statusEl = () => document.getElementById('landing-status');
    const listEl = () => document.getElementById('file-list');

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function formatModified(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function selectFile(name) {
      selected = name;
      document.querySelectorAll('.file-row').forEach(r => {
        r.classList.toggle('selected', r.dataset.file === name);
      });
    }

    function enterFile(name) {
      if (!name) return;
      localStorage.setItem(LAST_FILE_KEY, name);
      window.location.href = 'app.html?file=' + encodeURIComponent(name);
    }

    async function loadFiles() {
      try {
        const res = await fetch('/api/files');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const files = (data.files || []).sort((a, b) => String(b.modified).localeCompare(String(a.modified)));

        const empty = document.getElementById('file-empty');
        const list = listEl();
        list.innerHTML = '';

        if (files.length === 0) {
          empty.style.display = 'block';
          return;
        }
        empty.style.display = 'none';

        files.forEach(f => {
          const row = document.createElement('div');
          row.className = 'file-row';
          row.dataset.file = f.name;
          if (f.name === selected) row.classList.add('selected');
          row.innerHTML =
            '<div class="file-info">' +
            '<span class="file-name">' + f.name.replace(/\.json$/i, '').toUpperCase() + '</span>' +
            '<span class="file-meta">' + formatSize(f.size) + ' &middot; ' + formatModified(f.modified) + '</span>' +
            '</div>' +
            '<button class="file-enter">ENTER</button>';
          list.appendChild(row);
        });

        if (files.length > 0 && !selected) selectFile(files[0].name);
      } catch (e) {
        statusEl().textContent = 'ERROR LOADING FILES: ' + e.message;
      }
    }

    listEl().addEventListener('click', e => {
      const row = e.target.closest('.file-row');
      if (!row) return;
      const name = row.dataset.file;
      if (e.target.closest('.file-enter')) return enterFile(name);
      selectFile(name);
    });

    async function createFile() {
      const input = document.getElementById('new-file-name');
      const raw = input.value.trim();
      if (!raw) { statusEl().textContent = 'ENTER A PROFILE NAME'; return; }
      if (!/^[\w][\w .-]*$/.test(raw)) { statusEl().textContent = 'INVALID NAME — USE LETTERS, NUMBERS, SPACES, - OR _'; return; }
      const fileName = raw.toLowerCase().replace(/\.json$/i, '') + '.json';
      try {
        const res = await fetch('/api/files?file=' + encodeURIComponent(fileName), { method: 'POST' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        input.value = '';
        statusEl().textContent = 'FILE CREATED';
        await loadFiles();
        selectFile(fileName);
      } catch (e) {
        statusEl().textContent = 'CREATE FAILED: ' + e.message;
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.activeElement && document.activeElement.id === 'new-file-name') return;
      if (selected) enterFile(selected);
    });

    loadFiles();
  </script>
</body>
</html>
